[project]
name = "loomwork"
version = "0.1.1"
description = "Weaves shared agent rules through your projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.11"
authors = [{ name = "ProperlyDo" }]
keywords = ["agents", "claude-code", "opencode", "rules", "skills", "AGENTS.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# a session-start hook runs this, so the venv it lands in must stay simple to resolve
dependencies = [
    "click==8.5.0",  # the command line
    "questionary==2.1.1",  # init's interactive prompts
]

[project.scripts]
loom = "loomwork.cli:cli"

[project.urls]
Repository = "https://github.com/ProperlyDo/agents-loomwork"
Issues = "https://github.com/ProperlyDo/agents-loomwork/issues"

[build-system]
requires = ["hatchling>=1.27"]  # the license expression and license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loomwork"]

[tool.hatch.build.targets.sdist]
include = ["loomwork", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# What every prefix below covers: https://docs.astral.sh/ruff/rules/
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501",  # the formatter owns line length; E501 only fires on what it cannot split
    "ISC001",  # conflicts with the formatter
    "S603",  # every subprocess call here is a fixed git command with path arguments
    "S607",  # git is resolved from PATH on purpose, so a machine's own install is used
    "T201",  # a CLI talks to the terminal; info(), warn() and error() are the only printers
]

[tool.ruff.lint.mccabe]
max-complexity = 12
